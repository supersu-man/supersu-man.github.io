<div class="divide-y divide-white/[0.08] border-t border-b border-white/[0.08]">
  @for (item of projects; track item.title) {
    @if (item.link) {
      <a [href]="item.link" target="_blank" rel="noopener noreferrer"
         class="group py-6 flex flex-col md:flex-row md:items-center justify-between gap-4 hover:bg-white/[0.02] px-4 -mx-4 rounded-2xl transition-colors duration-200">
        <div class="md:w-1/3">
          <h3 class="text-lg md:text-xl font-bold text-white group-hover:text-[#a8ebc0] transition-colors flex items-center gap-2">
            <span>{{ item.title }}</span>
          </h3>
        </div>

        <div class="md:w-5/12">
          <p class="text-neutral-400 text-sm leading-relaxed">{{ item.subtitle }}</p>
        </div>

        <div class="md:w-1/4 flex items-center justify-between md:justify-end gap-6">
          <span class="text-xs font-mono text-neutral-500 tracking-wider text-right">{{ item.technologies }}</span>
          <span class="text-neutral-400 group-hover:text-[#a8ebc0] group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform text-lg">↗</span>
        </div>
      </a>
    } @else {
      <div class="py-6 flex flex-col md:flex-row md:items-center justify-between gap-4 px-4 -mx-4 rounded-2xl">
        <div class="md:w-1/3">
          <h3 class="text-lg md:text-xl font-bold text-white flex items-center gap-2">
            <span>{{ item.title }}</span>
          </h3>
        </div>

        <div class="md:w-5/12">
          <p class="text-neutral-400 text-sm leading-relaxed">{{ item.subtitle }}</p>
        </div>

        <div class="md:w-1/4 flex items-center justify-between md:justify-end gap-6">
          <span class="text-xs font-mono text-neutral-500 tracking-wider text-right">{{ item.technologies }}</span>
        </div>
      </div>
    }
  }
</div>

<div class="mt-12 text-center">
  <a routerLink="/projects"
     class="inline-flex items-center gap-2 border border-white/15 hover:border-[#a8ebc0] bg-white/[0.03] hover:bg-[#a8ebc0]/10 text-white hover:text-[#a8ebc0] text-sm md:text-base font-medium px-8 py-4 rounded-full transition-all duration-200 group shadow-lg hover:shadow-[#a8ebc0]/10 hover:scale-[1.02] active:scale-[0.98]">
    <span>Explore all {{ projectCount }} projects & open-source tools</span>
    <span class="group-hover:translate-x-1 transition-transform">→</span>
  </a>
</div>
